<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Contact Modal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for textarea if needed */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        .dark textarea::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-gray-900 dark:text-gray-100 overflow-hidden h-screen w-full relative">
<!-- Background Content (Simulating the CRM interface behind the modal) -->
<div class="absolute inset-0 z-0 flex flex-col blur-[2px] opacity-40 pointer-events-none select-none">
<header class="h-16 border-b border-gray-200 dark:border-gray-800 flex items-center px-6 bg-white dark:bg-gray-900">
<div class="w-8 h-8 rounded-full bg-primary/20 mr-4"></div>
<div class="h-4 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
</header>
<div class="flex-1 p-8">
<div class="flex justify-between items-center mb-6">
<div class="h-8 w-48 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="h-10 w-32 bg-primary rounded-lg"></div>
</div>
<div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 h-[600px] p-6">
<div class="space-y-4">
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800 rounded border border-gray-100 dark:border-gray-700"></div>
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800 rounded border border-gray-100 dark:border-gray-700"></div>
<div class="h-12 w-full bg-gray-50 dark:bg-gray-800 rounded border border-gray-100 dark:border-gray-700"></div>
</div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-10" role="dialog">
<!-- Backdrop -->
<div class="fixed inset-0 bg-gray-900/75 transition-opacity backdrop-blur-sm"></div>
<div class="fixed inset-0 z-10 w-screen overflow-y-auto">
<div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
<!-- Modal Panel -->
<div class="relative transform overflow-hidden rounded-xl bg-white dark:bg-gray-800 text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-200 dark:border-gray-700">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800">
<div>
<h3 class="text-xl font-semibold leading-6 text-gray-900 dark:text-white" id="modal-title">Add New Contact</h3>
<p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Enter the details for your new lead.</p>
</div>
<button class="rounded-md bg-transparent text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:hover:text-gray-300" type="button">
<span class="sr-only">Close</span>
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-6 py-6 space-y-5 max-h-[70vh] overflow-y-auto">
<!-- Avatar & Name Group -->
<div class="flex gap-4 items-start">
<div class="flex-shrink-0">
<div class="h-14 w-14 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center border-2 border-dashed border-gray-300 dark:border-gray-600 hover:border-primary cursor-pointer transition-colors group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary">add_a_photo</span>
</div>
</div>
<div class="flex-grow space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="full-name">Full Name <span class="text-red-500">*</span></label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-gray-400 text-[20px]">person</span>
</div>
<input class="block w-full rounded-lg border-0 py-2.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6" id="full-name" name="full-name" placeholder="Jane Doe" type="text"/>
</div>
</div>
</div>
<!-- Email & Phone Grid -->
<div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="email">Email Address</label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-gray-400 text-[20px]">mail</span>
</div>
<input class="block w-full rounded-lg border-0 py-2.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6" id="email" name="email" placeholder="jane@company.com" type="email"/>
</div>
</div>
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="phone">Phone Number</label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-gray-400 text-[20px]">call</span>
</div>
<input class="block w-full rounded-lg border-0 py-2.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="text"/>
</div>
</div>
</div>
<!-- Company & Role Grid -->
<div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="company">Company</label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-gray-400 text-[20px]">domain</span>
</div>
<input class="block w-full rounded-lg border-0 py-2.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6" id="company" name="company" placeholder="Acme Corp" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="role">Position / Role</label>
<div class="relative rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-gray-400 text-[20px]">badge</span>
</div>
<input class="block w-full rounded-lg border-0 py-2.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6" id="role" name="role" placeholder="Marketing Manager" type="text"/>
</div>
</div>
</div>
<!-- Tags (Multi-select simulation) -->
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="tags">Tags</label>
<div class="min-h-[46px] w-full rounded-lg ring-1 ring-inset ring-gray-300 dark:ring-gray-600 bg-white dark:bg-gray-700 focus-within:ring-2 focus-within:ring-inset focus-within:ring-primary px-3 py-2 flex flex-wrap gap-2 items-center">
<!-- Chip 1 -->
<span class="inline-flex items-center rounded-full bg-blue-50 dark:bg-blue-900/30 px-2 py-1 text-xs font-medium text-primary ring-1 ring-inset ring-blue-700/10 dark:ring-blue-400/20">
                                    Lead
                                    <button class="ml-1 inline-flex h-4 w-4 flex-shrink-0 items-center justify-center rounded-full hover:bg-blue-200 hover:text-blue-500 focus:bg-blue-500 focus:text-white focus:outline-none dark:hover:bg-blue-800" type="button">
<span class="sr-only">Remove Lead tag</span>
<svg class="h-3 w-3" fill="currentColor" viewbox="0 0 20 20"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"></path></svg>
</button>
</span>
<!-- Chip 2 -->
<span class="inline-flex items-center rounded-full bg-purple-50 dark:bg-purple-900/30 px-2 py-1 text-xs font-medium text-purple-700 dark:text-purple-400 ring-1 ring-inset ring-purple-700/10 dark:ring-purple-400/20">
                                    Q4 Campaign
                                    <button class="ml-1 inline-flex h-4 w-4 flex-shrink-0 items-center justify-center rounded-full hover:bg-purple-200 hover:text-purple-500 focus:bg-purple-500 focus:text-white focus:outline-none dark:hover:bg-purple-800" type="button">
<span class="sr-only">Remove Q4 Campaign tag</span>
<svg class="h-3 w-3" fill="currentColor" viewbox="0 0 20 20"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"></path></svg>
</button>
</span>
<input class="flex-1 border-0 bg-transparent p-0 text-sm text-gray-900 focus:ring-0 placeholder:text-gray-400 dark:text-white dark:placeholder:text-gray-500 min-w-[80px]" id="tags" placeholder="Add tag..." type="text"/>
</div>
</div>
<!-- Notes -->
<div class="space-y-1">
<label class="block text-sm font-medium leading-6 text-gray-900 dark:text-gray-200" for="notes">Internal Notes</label>
<div class="relative rounded-md shadow-sm">
<textarea class="block w-full rounded-lg border-0 py-2.5 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-gray-700 dark:text-white dark:ring-gray-600 dark:placeholder:text-gray-500 sm:text-sm sm:leading-6 resize-none" id="notes" name="notes" placeholder="Add any relevant details about this contact..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="bg-gray-50 dark:bg-gray-700/50 px-6 py-4 flex flex-row-reverse gap-3 sm:px-6">
<button class="inline-flex w-full justify-center rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 sm:ml-3 sm:w-auto transition-colors" type="button">Save Contact</button>
<button class="mt-3 inline-flex w-full justify-center rounded-lg bg-white dark:bg-gray-700 px-5 py-2.5 text-sm font-semibold text-gray-900 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 sm:mt-0 sm:w-auto transition-colors" type="button">Cancel</button>
</div>
</div>
</div>
</div>
</div>
</body></html>
